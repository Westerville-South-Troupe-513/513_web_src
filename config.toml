title = "Westerville South Theatre"
baseURL = "https://wshstheatre.org"
locale = "en-us"
defaultContentLanguage = "en"
enableRobotsTXT = true
timeZone = "America/New_York"
disableKinds = ["taxonomy", "term"]

[languages]
  [languages.en]
    title = "Westerville South Theatre"
    weight = 1
    contentDir = "content/en"

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = "assets/notwatching/hugo_stats\\.json"
    target = "css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    disableWatch = true
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[permalinks]
  shows = "/shows/:slug/"

[[menus.main]]
  name = "Boosters"
  pageRef = "/about"
  weight = 10
[[menus.main]]
  name = "Shows"
  pageRef = "/shows"
  weight = 20
[[menus.main]]
  name = "Volunteer"
  pageRef = "/get-involved/volunteer"
  weight = 30
[[menus.main]]
  name = "Donate"
  pageRef = "/support"
  weight = 40
[[menus.main]]
  name = "Tickets"
  pageRef = "/tickets"
  weight = 50
