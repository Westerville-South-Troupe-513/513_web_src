        format: yaml-frontmatter
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: description
            type: text
          - name: hero_image
            label: Hero image
            type: image
            required: true
          - name: hero_image_large
            label: Hero image — large
            type: image
            description: "Optional larger version used on wide screens."
          - name: hero_image_alt
            label: Hero image description
            type: string
            required: true
          - name: body
            type: rich-text
      - name: support_page
        label: Support Us
        type: file
        path: content/en/support/_index.md
        format: yaml-frontmatter
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: description
            type: text
          - name: body
            type: rich-text
      - name: sponsor_page
        label: Become a Sponsor
        type: file
        path: content/en/support/become-a-sponsor.md
        format: yaml-frontmatter
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: description
            type: text
          - name: hero_image
            label: Hero image
            type: image
            required: true
          - name: hero_image_large
            label: Hero image — large
