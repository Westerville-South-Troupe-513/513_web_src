name: Build and Deploy Hugo to GH Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Grants permission to push to the gh-pages branch
      pages: write       # Needed if utilizing native GitHub Pages deployments
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install CSS dependencies
        run: npm ci
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true
      - name: Build Hugo Site
        run: hugo --cleanDestinationDir --minify --panicOnWarning -d public
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: wshstheatre.org
