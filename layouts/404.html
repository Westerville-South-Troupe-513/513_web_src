{{ define "main" }}
  <section class="error-page" aria-labelledby="error-title">
    <div class="container error-stage">
      <div class="error-stage-copy">
        <p class="eyebrow">Error 404 · Scene Missing</p>
        <p class="error-code" aria-hidden="true">404</p>
        <h1 class="display-title" id="error-title">This page missed its cue.</h1>
        <p class="error-description">The curtain is up, but there’s nothing on this part of the stage. The page may have moved, or the link may belong to an earlier production.</p>
        <div class="error-actions">
          <a class="button-primary" href="/">Return to the Lobby</a>
          <a class="button-secondary" href="/shows/">See What’s Playing</a>
        </div>
      </div>
    </div>
  </section>
{{ end }}
