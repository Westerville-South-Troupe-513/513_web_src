<header class="site-header">
  <div class="container-wide nav-inner">
    <a class="brand" href="/" aria-label="Westerville South Theatre home">
      <img class="brand-mark" src="/images/troupe513-mark-white.webp" alt="" width="300" height="300">
      <span class="brand-copy">
        Westerville South Theatre
        <small>Theatre Troupe 513 Boosters</small>
      </span>
    </a>
    <button class="menu-button" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-navigation" data-menu-button>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" focusable="false">
        <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
      </svg>
    </button>
    <ul class="nav-menu" id="primary-navigation" data-menu>
      {{ range site.Menus.main }}
        {{ $isTickets := eq .Name "Tickets" }}
        <li>
          <a class="nav-link{{ if $isTickets }} nav-link-tickets{{ end }}" href="{{ .URL }}"{{ if $.IsMenuCurrent .Menu . }} aria-current="page"{{ end }}>{{ .Name }}</a>
        </li>
      {{ end }}
    </ul>
  </div>
</header>
